name: Weekly Longevity Digest

on:
  schedule:
    # Every Monday at 07:00 UTC — digest lands in Notion before the work week starts
    - cron: "0 7 * * 1"
  workflow_dispatch:
    # Allow manual trigger from the Actions tab (useful for testing)

jobs:
  run-digest:
    name: Fetch, process, and publish digest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly digest
        env:
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY:           ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID:       ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DIGEST_PARENT_ID:  ${{ secrets.NOTION_DIGEST_PARENT_ID }}
        run: python -m longevity_digest.main
